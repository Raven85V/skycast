[platformio]
default_envs = skycast

; Метеостанция на Sunton ESP32-8048S070 (7", 800x480, ESP32-S3 N16R8)
; Платформа и флаги - как в рабочем PixelHub 75 (подтверждено на железе):
; pioarduino 55.03.37 (Arduino 3.3.7), -std=gnu++20 обязателен для ESP32-audioI2S master.

[env:skycast]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600
upload_flags = --no-stub

board_build.arduino.memory_type = qio_opi   ; PSRAM 8 МБ (octal)
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=0 -std=gnu++20 -DBOARD_SKYCAST
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.2.0
    https://github.com/schreibfaul1/ESP32-audioI2S.git#master
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
          knolleary/PubSubClient@^2.8

; Минимальный тест экрана (без остального проекта): pio run -e skycasttest -t upload
[env:skycasttest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_flags = --no-stub
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=0 -std=gnu++20 -DBOARD_SKYCAST -Isrc
build_src_filter = -<*> +<../hwtest/>
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
